<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a18cd1" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #cbd5e1;
      }

      /* Dynamic Animations (Background Ambient Elements) */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatOrb1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-16px) translateX(12px); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(14px) translateX(-15px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-float1 {
        animation: floatOrb1 7s ease-in-out infinite;
      }
      .animated-float2 {
        animation: floatOrb2 8s ease-in-out infinite;
      }
      .animated-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .animated-radar {
        transform-origin: 1040px 170px;
        animation: radarSweep 14s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="960" y1="0" x2="960" y2="340" />
  </g>

  <!-- Dynamic Glowing Background Orbs (Non-obstructive) -->
  <g class="animated-float1">
    <circle cx="1060" cy="90" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow-blur)" />
  </g>
  <g class="animated-float2">
    <circle cx="920" cy="240" r="160" fill="#a18cd1" opacity="0.12" filter="url(#glow-blur)" />
  </g>
  <g class="animated-pulse">
    <circle cx="150" cy="60" r="90" fill="#4facfe" opacity="0.15" filter="url(#glow-blur)" />
  </g>

  <!-- Animated Sensor Grid / Flow Constellation (Right Side Decoration) -->
  <g transform="translate(900, 60)" opacity="0.85">
    <!-- Outer concentric sensor rings -->
    <circle cx="140" cy="110" r="95" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="140" cy="110" r="65" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="140" cy="110" r="35" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Rotating Sensor Vector -->
    <g class="animated-radar">
      <line x1="140" y1="110" x2="140" y2="15" stroke="url(#primary-glow)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <polygon points="140,110 160,20 120,20" fill="url(#neon-cyan)" opacity="0.25" />
    </g>

    <!-- Node Constellations -->
    <circle cx="50" cy="60" r="4" fill="#38bdf8" />
    <circle cx="230" cy="70" r="4" fill="#a18cd1" />
    <circle cx="80" cy="170" r="4" fill="#4facfe" />
    <circle cx="210" cy="165" r="4" fill="#38bdf8" />
    <circle cx="140" cy="110" r="6" fill="#00f2fe" />

    <!-- Connecting Dynamic Flow Lines -->
    <path class="animated-line" d="M50 60 L140 110 L230 70 M80 170 L140 110 L210 165" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Foreground Content: Header Tag Badge -->
  <g transform="translate(60, 48)">
    <rect width="210" height="30" rx="15" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="30" y="20" class="badge-text">EMBODIED AI ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(60, 128)">
    <text class="title-text">Awesome Embodied AI</text>
    <text x="495" y="0" class="title-text" fill="url(#primary-glow)">Environments</text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(60, 172)">
    <text class="subtitle-text">Curated Simulators, Physics Engines, SaaS Platforms &amp; Benchmarks</text>
  </g>

  <!-- Feature Pillar Pills (Foreground) -->
  <g transform="translate(60, 222)">
    <!-- Pill 1: Photorealistic Sim -->
    <g transform="translate(0, 0)">
      <rect width="186" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)" />
      <circle cx="24" cy="21" r="5" fill="#00f2fe" />
      <text x="40" y="26" class="tag-text">Photorealistic Sim</text>
    </g>

    <!-- Pill 2: Physics Engines -->
    <g transform="translate(202, 0)">
      <rect width="176" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)" />
      <circle cx="24" cy="21" r="5" fill="#4facfe" />
      <text x="40" y="26" class="tag-text">Physics Engines</text>
    </g>

    <!-- Pill 3: Sim-to-Real -->
    <g transform="translate(394, 0)">
      <rect width="186" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)" />
      <circle cx="24" cy="21" r="5" fill="#a18cd1" />
      <text x="40" y="26" class="tag-text">Sim-to-Real Transfer</text>
    </g>

    <!-- Pill 4: Cloud SaaS & Open-Source -->
    <g transform="translate(596, 0)">
      <rect width="216" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="40" y="26" class="tag-text">Cloud SaaS &amp; Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primary-glow)" rx="2" />
</svg>
